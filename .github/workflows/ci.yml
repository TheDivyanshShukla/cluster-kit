name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 provisioning regressions
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          & .\scripts\tests\windows_provision.tests.ps1
          & .\scripts\tests\windows_release.tests.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (allowed to fail for now)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: cargo clippy --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - name: chaos
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        env:
          CK_POWER_DRY: "1"
        run: bash scripts/chaos.sh
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
  python:
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest python3 a lab PC may have (the SDK runner runs there); 3.13t / 3.14t are the free-threaded builds
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # accepts "3.13t" / "3.14t" (setup-python v5.6+); if a future runner drops them, remove those two entries
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::DeprecationWarning -m unittest discover -s python/tests
      - name: 'ML smoke tests (numpy, pandas, scikit-learn; no torch: too big for CI, run examples/sdk/ml_torch.py locally)'
        if: matrix.python == '3.12'
        run: |
          python -m pip install numpy pandas scikit-learn
          for f in numpy pandas sklearn; do python examples/sdk/ml_$f.py; done
      - uses: astral-sh/setup-uv@v6
        if: matrix.python == '3.12'
      - name: "ruff (latest): full type hints"
        if: matrix.python == '3.12'
        run: uvx ruff@latest check .
