[package]
name = "ck"
version = "0.1.0"
edition = "2021"

[dependencies]
socket2 = { version = "0.6", features = ["all"] }   # shared UDP broadcast listeners (worker, standby, head)
pollster = { version = "1.0.1", optional = true }
rayon = "1"
sha2 = { version = "0.10", features = ["compress"] }   # picks SHA-NI / ARMv8 SHA instructions at runtime when the CPU has them
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
wgpu = { version = "30.0.1", optional = true }
serde = { version = "1", features = ["derive"] }   # protocol v2 HELLO and control messages (JSON)
serde_json = "1"
tiny_http = "0.12"   # head HTTP API + SSE + console (D3)
rusqlite = { version = "=0.32.1", features = ["bundled"] }   # head state (D4); bundled = no system SQLite needed

[profile.release]
lto = true
codegen-units = 1

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]   # `ck worker --gpu`; build without it: cargo build --release --no-default-features
