<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watch · Review</title>
<link rel="stylesheet" href="/ui/app.css"></head><body>
<!-- The old single-camera clip page is replaced by the review editor; keep its links working. -->
<main><p class="quiet" style="padding:1rem">Opening the review editor… <a id="go" href="/review">Continue</a></p></main>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var to = "/review" + (id ? "?source=" + encodeURIComponent(id) : "");
  document.getElementById("go").href = to;
  location.replace(to);
})();
</script>
</body></html>
