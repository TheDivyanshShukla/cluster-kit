<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · Clip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header>
  <a class="brand" href="/">Watch</a>
  <nav>
    <a href="/">Wall</a>
    <a href="/find">Find</a>
    <a href="/analytics">Analytics</a>
    <a href="/setup">Setup</a>
  </nav>
  <div class="meters">
    <div class="ops"><b id="f-ops">0</b><span>ops / s</span></div>
    <div class="lack"><b id="f-lack">0</b><span>lacking / s</span></div>
    <div><b id="f-pcs">0</b><span>PCs joined</span></div>
    <div><b id="f-warn">0</b><span>warnings</span></div>
  </div>
</header>
<main>
  <div class="film" id="film"></div>
  <div class="monitor" id="monitor"><video id="vid" controls playsinline></video></div>
  <div class="tl" id="tl">
    <div class="tl-head">
      <b id="ed-name">Clip</b>
      <span id="ed-clock" class="mono">0:00</span>
      <a class="save" href="/">Wall</a>
    </div>
    <div class="sheet" id="sheet">
      <div class="ruler" id="ruler"></div>
      <div id="tracks"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>
  <p class="quiet" id="clip-note"></p>
</main>
<script src="/ui/app.js"></script>
<script src="/ui/clip.js"></script>
</body>
</html>
