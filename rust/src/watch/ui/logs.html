<div class="connection hide" id="connection" role="status"></div>
<main>
<div class="page-heading"><div><h1>Activity</h1><p class="sentence">Configuration changes, query runs, index jobs, failures, model changes and alert decisions.</p></div><button type="button" id="logs-refresh">Refresh activity</button></div>
