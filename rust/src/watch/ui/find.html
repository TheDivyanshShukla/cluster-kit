<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · Find</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/ui/product.css">
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Watch home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 8V3h5M17 3h5v5M22 16v5h-5M7 21H2v-5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Watch</a>
  <nav aria-label="Main navigation"><a href="/">Live</a><a href="/find" aria-current="page">Search</a><a href="/sources">Sources</a><a href="/setup">Rules & models</a><a href="/analytics">Cluster</a><a href="/logs">Activity</a></nav>
  <div class="meters">
    <div class="ops"><b id="f-ops">0</b><span>ops / s</span></div>
    <div class="lack"><b id="f-lack">0</b><span>lacking / s</span></div>
    <div><b id="f-pcs">0</b><span>PCs joined</span></div>
    <div><b id="f-warn">0</b><span>warnings</span></div>
  </div>
</header>
<div class="connection hide" id="connection" role="status"></div>
<main class="ws-main">
  <div class="ws-tabs modes" id="ws-tabs" role="group" aria-label="Panes"><button type="button" data-pane="scope" aria-pressed="false">Scope</button><button type="button" data-pane="code" aria-pressed="true">Editor</button><button type="button" data-pane="results" aria-pressed="false">Results <span class="tag" id="res-badge"></span></button></div>
  <form class="ws" id="ask" action="/find" data-pane="code">
    <section class="pane pane-scope" aria-label="Scope">
      <div class="pane-h">Scope</div>
      <div class="pane-b">
        <label for="b-group">Source group (this browser)</label>
        <select id="b-group"><option value="">No group</option></select>
        <div class="check-list" id="b-sources" role="group" aria-label="Sources to search"><span class="quiet">Loading sources…</span></div>
        <p class="field-help">No source ticked = all sources.</p>
        <div id="time-block">
          <div class="row2"><label>From<input id="from" type="datetime-local"></label><label>To<input id="to" type="datetime-local"></label></div>
          <p class="field-help" id="time-note"></p>
        </div>
        <div class="pane-h sub">Saved searches</div>
        <div id="saved"></div>
      </div>
    </section>
    <section class="pane pane-results" aria-label="Results" aria-live="polite">
      <div class="pane-h"><span>Results</span><span class="quiet" id="hit-count">Run a query.</span></div>
      <div class="pane-b">
        <div id="run-summary"></div>
        <div id="hits"></div>
        <div class="pager"><button type="button" id="more" class="hide">Load more</button><span class="msg" id="more-msg"></span></div>
      </div>
    </section>
    <section class="pane pane-code" aria-label="Query editor">
      <div class="modes" id="find-modes" role="group" aria-label="Query mode">
        <button type="button" data-mode="sql" aria-pressed="true">SQL</button>
        <button type="button" data-mode="lua" aria-pressed="false">Lua</button>
        <button type="button" data-mode="builder" aria-pressed="false">Builder</button>
        <button type="button" data-mode="words" aria-pressed="false">Words</button>
        <button type="button" data-mode="template" aria-pressed="false">Template</button>
      </div>
      <p class="field-help hide pad" id="classic-note">Classic mode searches the legacy sightings index. Results are clips, not a saved query run.</p>
      <div id="mode-builder" class="hide pad">
        <div class="row2"><label>Class<input id="b-class" list="class-list" placeholder="person" autocomplete="off"></label><label>Min confidence<input id="b-conf" type="number" min="0" max="1" step="0.05" placeholder="0.5"></label></div><datalist id="class-list"></datalist>
        <p class="field-help"><span id="sql-state" class="badge"></span> <button type="button" id="sql-regen" class="sm hide">Regenerate from builder</button> <span id="sql-help"></span></p>
      </div>
      <div id="mode-sql" class="edwrap">
        <div class="ed" id="ed-sql" data-lang="sql"><div class="ed-gut" aria-hidden="true"><div></div></div><div class="ed-body"><pre class="ed-err" aria-hidden="true"></pre><pre class="ed-hl" aria-hidden="true"></pre><textarea id="sql" class="ed-in" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" aria-label="SQL query"></textarea></div></div>
      </div>
      <div id="mode-lua" class="edwrap hide">
        <div class="ed" id="ed-lua" data-lang="lua"><div class="ed-gut" aria-hidden="true"><div></div></div><div class="ed-body"><pre class="ed-err" aria-hidden="true"></pre><pre class="ed-hl" aria-hidden="true"></pre><textarea id="lua" class="ed-in" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" aria-label="Lua script"></textarea></div></div>
      </div>
      <div id="mode-words" class="hide pad"><label for="q">Words</label><input id="q" type="search" placeholder="blue person, bicycle, Street"></div>
      <div id="mode-template" class="hide pad"><label for="t-class">Class</label><input id="t-class" placeholder="person"><label for="t-color">Colour</label><input id="t-color" placeholder="blue"><label for="t-cam">Camera</label><input id="t-cam" placeholder="Street"></div>
      <div class="ed-err-msg msg" id="find-err" role="alert"></div>
      <p class="field-help pad" id="code-help"></p>
      <div class="ed-bar">
        <button type="submit" id="run-find" class="primary">Run <span class="kbd">Ctrl/&#8984;&#8629;</span></button>
        <button type="button" id="run-classic" class="hide" title="Secondary: runs a classic predicate (return function(hit) … end) on the legacy sightings index. Not a saved query run.">Run on classic index</button>
        <label class="sr-only" for="snip">Snippets</label><select id="snip" style="width:auto;max-width:11rem"></select>
        <label class="sr-only" for="search-name">Name this search</label><input id="search-name" placeholder="Name" style="width:7rem;flex:1 1 6rem">
        <button type="button" id="save-search">Save</button>
      </div>
      <div class="msg pad" id="save-msg" role="status"></div>
    </section>
  </form>
</main>
<script src="/ui/app.js"></script>
<script src="/ui/find.js"></script>
</body>
</html>
