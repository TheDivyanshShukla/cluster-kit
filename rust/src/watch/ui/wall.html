<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch · Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header>
  <a class="brand" href="/">Watch</a>
  <nav>
    <a href="/" aria-current="page">Wall</a>
    <a href="/find">Find</a>
    <a href="/analytics">Analytics</a>
    <a href="/setup">Setup</a>
  </nav>
  <div class="meters">
    <div class="ops"><b id="f-ops">0</b><span>ops / s</span></div>
    <div class="lack"><b id="f-lack">0</b><span>lacking / s</span></div>
    <div><b id="f-pcs">0</b><span>PCs joined</span></div>
    <div><b id="f-warn">0</b><span>warnings</span></div>
  </div>
</header>
<main>
  <p class="sentence" id="sentence"></p>
  <div class="row">
    <button type="button" id="mode-one">One PC</button>
    <button type="button" id="mode-all" aria-pressed="true">All PCs</button>
  </div>
  <p class="quiet" id="proc-live"></p>
  <div id="warnings"></div>
  <div class="wall" id="tiles"></div>
  <p class="empty hide" id="wall-empty"></p>
  <h2>Checks</h2>
  <div id="events"></div>
  <p class="footnote" id="foot"></p>
</main>
<script src="/ui/app.js"></script>
<script src="/ui/wall.js"></script>
</body>
</html>
